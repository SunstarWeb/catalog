  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding-bottom:40px;
  }

  header{
    position:sticky;
    top:0;
    z-index:10;
    background:rgba(21,17,22,0.96);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
    padding:14px 16px 12px;
  }
  .title-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:10px;
  }
  h1{
    font-size:15px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink-dim);
    margin:0;
    font-weight:600;
  }
  h1 span{color:var(--accent);}
  #count{
    font-family:var(--mono);
    font-size:12px;
    color:var(--ink-dim);
  }
  .pending-banner{
    text-align:center;
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--accent);
    border:1px solid var(--accent-dim);
    background:rgba(255,122,51,0.08);
    border-radius:8px;
    padding:6px 10px;
    margin-bottom:10px;
  }
  .controls{
    display:flex;
    gap:8px;
  }
  #customer{
    flex:0 0 150px;
    padding:11px 10px;
    border-radius:10px;
    border:1px solid var(--line);
    background:#1c1620;
    color:var(--accent);
    font-size:14px;
    font-weight:600;
    outline:none;
    -webkit-appearance:none;
    appearance:none;
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M0 0l5 6 5-6z" fill="%23a99cae"/></svg>');
    background-repeat:no-repeat;
    background-position:right 12px center;
    padding-right:26px;
  }
  #customer:focus{border-color:var(--accent);}
  #search{
    flex:1;
    min-width:0;
    padding:11px 14px;
    border-radius:10px;
    border:1px solid var(--line);
    background:#1c1620;
    color:var(--ink);
    font-size:16px;
    outline:none;
  }
  #search:focus{border-color:var(--accent);}
  #search::placeholder{color:#6e6274;}

  main{padding:14px;}
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
    gap:12px;
  }
  .card{
    background:var(--bg-card);
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  .status-badge{
    position:absolute;
    top:8px;
    left:8px;
    z-index:2;
    font-family:var(--mono);
    font-size:11px;
    font-weight:700;
    padding:2px 7px;
    border-radius:6px;
    letter-spacing:0.03em;
    background:rgba(21,17,22,0.85);
  }
  .status-badge.repeat{
    color:var(--accent);
    border:1px solid var(--accent-dim);
  }
  .status-badge.new{
    color:var(--new);
    border:1px solid var(--new-dim);
  }
  .thumb{
    width:100%;
    aspect-ratio:1/1;
    background:#0f0c11 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="%23473b4d" stroke-width="1.5"><path d="M3 16l4-4a2 2 0 0 1 3 0l5 5"/><circle cx="9" cy="9" r="1.5"/><rect x="2" y="3" width="20" height="18" rx="2"/></svg>') center/28px no-repeat;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .info{padding:9px 10px 11px;}
  .sku{
    font-family:var(--mono);
    font-size:13px;
    color:var(--accent);
    font-weight:600;
    letter-spacing:0.01em;
  }
  .vendor{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-dim);
    margin-top:1px;
    word-break:break-all;
  }
  .desc{
    font-size:13px;
    line-height:1.35;
    margin-top:6px;
    color:var(--ink);
  }
  .cost{
    font-family:var(--mono);
    font-size:12px;
    color:var(--ink-dim);
    margin-top:6px;
  }
  .cost b{color:var(--ink);font-family:inherit;}
  #empty{
    display:none;
    text-align:center;
    color:var(--ink-dim);
    padding:60px 20px;
    font-size:14px;
  }

  /* lightbox */
  #lightbox{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(10,8,11,0.92);
    z-index:100;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  #lightbox.open{display:flex;}
  #lightbox img{
    max-width:100%;
    max-height:78vh;
    border-radius:8px;
    box-shadow:0 20px 60px rgba(0,0,0,0.6);
  }
  #lightbox-cap{
    position:absolute;
    bottom:28px;
    left:0;right:0;
    text-align:center;
    color:var(--ink-dim);
    font-family:var(--mono);
    font-size:12px;
    padding:0 20px;
  }
  #lightbox-cap b{color:var(--ink);font-family:inherit;}
</style>

const customerSelect = document.getElementById('customer');
const grid = document.getElementById('grid');
const search = document.getElementById('search');
const countEl = document.getElementById('count');
const emptyEl = document.getElementById('empty');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');
const lightboxCap = document.getElementById('lightbox-cap');

const placeholderOpt = document.createElement('option');
placeholderOpt.value = '';
placeholderOpt.textContent = 'Select customer…';
customerSelect.appendChild(placeholderOpt);

Object.keys(dataByCustomer).sort((a,b)=>a.localeCompare(b)).forEach(name => {
  const opt = document.createElement('option');
  opt.value = name;
  opt.textContent = name;
  customerSelect.appendChild(opt);
});
customerSelect.value = '';

function currentProducts(){
  return dataByCustomer[customerSelect.value] || [];
}

function render(){
  if (!customerSelect.value){
    grid.innerHTML = '';
    countEl.textContent = '';
    emptyEl.textContent = 'Please select a customer';
    emptyEl.style.display = 'block';
    return;
  }

  const q = search.value.trim().toLowerCase();
  const source = currentProducts();
  const filtered = !q ? source : source.filter(p =>
    p.item.toLowerCase().includes(q) ||
    p.vendor.toLowerCase().includes(q) ||
    p.desc.toLowerCase().includes(q)
  );
  const list = filtered.slice().sort((a, b) => {
    if (a.repeat !== b.repeat) return a.repeat ? -1 : 1;
    return parseFloat(a.cost) - parseFloat(b.cost);
  });

  emptyEl.textContent = 'No matching items';
  grid.innerHTML = '';
  list.forEach(p => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="status-badge ${p.repeat ? 'repeat' : 'new'}">${p.repeat ? 'Repeat' : 'New'}</div>
      <div class="thumb">
        <img src="assets/gti_images/${p.item}.jpg" alt="${p.item}" loading="lazy"
             onerror="this.parentElement.classList.add('noimg'); this.remove();">
      </div>
      <div class="info">
        <div class="sku">#${p.item}</div>
        <div class="vendor">${p.vendor}</div>
        <div class="desc">${p.desc}</div>
        <div class="cost">Cost: <b>$${p.cost}</b></div>
      </div>`;
    card.querySelector('.thumb').addEventListener('click', () => openLightbox(p));
    grid.appendChild(card);
  });
  countEl.textContent = list.length + ' items';
  emptyEl.style.display = list.length ? 'none' : 'block';
}

function openLightbox(p){
  lightboxImg.src = `assets/gti_images/${p.item}.jpg`;
  lightboxCap.innerHTML = `<b>#${p.item}</b>&nbsp; ${p.repeat ? 'Repeat' : 'New'} &middot; ${p.vendor} &middot; ${p.desc} &middot; $${p.cost}`;
  lightbox.classList.add('open');
}
lightbox.addEventListener('click', () => lightbox.classList.remove('open'));

customerSelect.addEventListener('change', render);
search.addEventListener('input', render);

render();
</script>
